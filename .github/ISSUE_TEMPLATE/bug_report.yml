name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in Odyssey.
title: "[Bug]: "
labels: ["type: bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can the maintainers or contributors reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment Info
      description: Please share your browser, OS, and screen dimensions if applicable.
      value: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 24.04]
        - Browser: [e.g. Chrome 128, Safari 18, Firefox 130]
        - Device: [e.g. Desktop, Mobile iPhone 15]
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am willing to submit a PR to fix this issue if assigned.
          required: false
