name: ✨ Feature Request
description: Propose a new feature, improvement, or workflow enhancement for Odyssey.
title: "[Feature]: "
labels: ["type: feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make Odyssey better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are experiencing.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or UX
      description: Describe what you want to happen and how you envision it working.
      placeholder: Add an option to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other solutions or workarounds?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this feature myself if approved.
          required: false
